<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#ffffff" />
        <link rel="icon" type="image/png" href="/favicon.png" />

        <title>The Size of Anything</title>
        <meta name="description"
            content="Pick up any place on Earth and drop it somewhere else at its true size. Compare countries, cities, parks, buildings, and blue whales." />
        <link rel="canonical" href="https://thesizeofanything.com/" />

        <meta property="og:site_name" content="The Size of Anything" />
        <meta property="og:title" content="The Size of Anything" />
        <meta property="og:description"
            content="Pick up any place on Earth and drop it somewhere else at its true size. Compare countries, cities, parks, buildings, and blue whales." />
        <meta property="og:image" content="https://thesizeofanything.com/preview.png" />
        <!-- The size of public/preview.png: update these when the image changes. -->
        <meta property="og:image:width" content="864" />
        <meta property="og:image:height" content="484" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://thesizeofanything.com/" />
        <!-- X reads the og: tags for everything else; only the card type has no og: equivalent. -->
        <meta name="twitter:card" content="summary_large_image" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "The Size of Anything",
                "alternateName": "thesizeofanything.com",
                "url": "https://thesizeofanything.com/"
            }
        </script>
    </head>
    <body>
        <div id="root"></div>

        <!-- Hidden Netlify Form for pre-rendering -->
        <form name="feedback" data-netlify="true" hidden>
            <input type="hidden" name="form-name" value="feedback" />
            <input type="radio" name="feedbackType" value="major-bug" />
            <input type="radio" name="feedbackType" value="minor-bug" />
            <input type="radio" name="feedbackType" value="feature-request" />
            <textarea name="details"></textarea>
            <input type="email" name="email" />
        </form>

        <script>
            (function () {
                var dark = false, basemap = "map";
                try {
                    var s = JSON.parse(localStorage.getItem("soa-settings-v2") || "{}").state || {};
                    var t = s.theme || "system";
                    dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                    basemap = s.basemap || "map";
                    document.documentElement.dataset.theme = dark ? "dark" : "light";
                } catch (e) {}
                // Fetch the map style and its tile index now, not after the app's JavaScript has loaded:
                // the map can't start without them. Same URLs as BASEMAPS in src/config.ts and buildStyle()
                // in src/map/mapCore.ts (satellite uses the light style for its labels).
                var style = basemap === "map" && dark ? "fiord" : "liberty";
                ["https://tiles.openfreemap.org/styles/" + style, "https://tiles.openfreemap.org/planet"].forEach(function (href) {
                    var l = document.createElement("link");
                    l.rel = "preload";
                    l.as = "fetch";
                    l.crossOrigin = "anonymous";
                    l.href = href;
                    document.head.appendChild(l);
                });
            })();
        </script>
        <script>
            // Share links from the old version (#share=…) only work there, so open them there.
            if (location.hash.indexOf("#share=") === 0) location.replace("https://old.thesizeofanything.com/" + location.hash);
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
