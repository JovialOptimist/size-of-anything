<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <meta name="robots" content="noindex" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <title>Page not found – The Size of Anything</title>
        <script>
            // Same as index.html: use the theme picked in the app's settings.
            try {
                var t = (JSON.parse(localStorage.getItem("soa-settings-v2") || "{}").state || {}).theme || "system";
                var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.dataset.theme = d ? "dark" : "light";
            } catch (e) {}
        </script>
        <style>
            /* Copied from src/styles/app.css and the purple preset in src/config.ts; update them together. */
            :root {
                --bg: oklch(0.975 0.004 255);
                --text: #1b2026;
                --text-muted: #555b63;
                --accent: #6d4ae0;
                --on-accent: #ffffff;
            }
            :root[data-theme="dark"] {
                --bg: #0e1217;
                --text: #e8ebef;
                --text-muted: #a6abb2;
                --accent: #b39cff;
                --on-accent: #120d24;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme]) {
                    --bg: #0e1217;
                    --text: #e8ebef;
                    --text-muted: #a6abb2;
                    --accent: #b39cff;
                    --on-accent: #120d24;
                }
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 16px;
                box-sizing: border-box;
                background: var(--bg);
                color: var(--text);
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                text-align: center;
            }
            h1 { font-size: 1.6rem; margin: 0 0 8px; }
            p { color: var(--text-muted); margin: 0 0 24px; }
            a {
                display: inline-block;
                padding: 10px 18px;
                border-radius: 12px;
                background: var(--accent);
                color: var(--on-accent);
                font-weight: 600;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Page not found</h1>
            <p>There's nothing at this address.</p>
            <a href="/">Open The Size of Anything</a>
        </main>
    </body>
</html>
